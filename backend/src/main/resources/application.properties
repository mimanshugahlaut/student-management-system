# Server port
server.port=8080

# H2 in-memory database settings (no install needed, resets on restart)
spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create/update tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Enables the H2 web console at http://localhost:8080/h2-console
# (useful to see your data directly in the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
